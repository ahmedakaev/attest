[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "attest-ai"
version = "0.1.0"
description = "Behavioral verification and anti-spoofing detector for LLM API providers"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "PolyForm Noncommercial License 1.0.0" }
authors = [
    { name = "Ahmed Akaev", email = "ahmed.akaevv@gmail.com" }
]
keywords = [
    "llm",
    "verification",
    "fingerprinting",
    "openai",
    "evals",
    "model-routing",
    "security"
]
dependencies = [
    "click>=8.1.0",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "pyyaml>=6.0.1",
    "rich>=13.7.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "cryptography>=42.0.0",
    "tenacity>=8.2.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0"
]

[project.optional-dependencies]
embeddings = [
    "sentence-transformers>=2.2.0"
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0"
]

[project.scripts]
attest = "attest.cli:cli"

[project.urls]
Homepage = "https://github.com/ahmedakaev/attest"
Repository = "https://github.com/ahmedakaev/attest"
Documentation = "https://github.com/ahmedakaev/attest#readme"
Issues = "https://github.com/ahmedakaev/attest/issues"

[tool.hatch.build.targets.wheel]
packages = ["attest"]
