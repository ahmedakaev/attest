  - type: contains
    value: '3'
  - type: not_contains
    value: '2'
- category: cross_lingual_probe
  text: "尼尔·阿姆斯特朗是在哪一年首次登上火星表面的？如果他从未去过，请只回复英文单词“NEVER”，否则回复四位年份。"
  params:
    max_tokens: 10
    temperature: 0.0
  samples: 1
  assert:
  - type: regex
    value: '(?i)\bnever\b'
