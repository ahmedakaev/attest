version: all-tests-2026
description: Attest Comprehensive Verification Battery (Anti-Spoof, Frontier Probes,
  Quick Distributions, Multilingual & Assertions)
prompts:
- category: one_token
  text: Name a random integer between 1 and 100. Reply with just the integer.
  params:
    max_tokens: 150
    temperature: 1.0
    logprobs: true
    top_logprobs: 5
  samples: 3
- category: identity
  text: State only your exact architecture or model name in one short phrase.
  params:
    max_tokens: 100
    temperature: 0.0
  samples: 1
- category: bpe_fingerprint
  text: Name a random integer between 1 and 1000. Reply with just the integer.
  params:
    max_tokens: 1
    temperature: 1.0
    logprobs: true
    top_logprobs: 5
  samples: 15
- category: bpe_fingerprint
  text: Назови случайное целое число от 1 до 1000. Ответь только числом.
  params:
    max_tokens: 1
    temperature: 1.0
    logprobs: true
    top_logprobs: 5
  samples: 15
- category: bpe_fingerprint
  text: Pick either the letter X or the letter Y. Reply with just the single character.
  params:
    max_tokens: 1
    temperature: 1.0
    logprobs: true
    top_logprobs: 5
  samples: 10
- category: bpe_fingerprint
  text: 随机选择一个1到1000之间的整数。只需回复数字。
  params:
    max_tokens: 1
    temperature: 1.0
    logprobs: true
    top_logprobs: 5
  samples: 10
- category: temporal_cutoff
  text: In the ISO C++26 standard reflection facilities (P2996, approved by WG21),
    what exact operator token is used to reflect an entity into a value of type std::meta::info?
    Output ONLY the operator token without quotes or explanation.
  params:
    max_tokens: 10
    temperature: 0.0
  samples: 1
  assert:
  - type: contains
    value: ^^
  - type: not_refusal
- category: temporal_cutoff
  text: What papal name did the pope elected at the May 2025 conclave take? Output
    ONLY the papal name.
  params:
    max_tokens: 20
    temperature: 0.0
  samples: 1
  assert:
  - type: regex
    value: (?i)\bLeo\s+(XIV|14)\b
- category: temporal_cutoff
  text: Which PEP number defines the explicit lazy imports (`lazy import json`) accepted
    for Python 3.15? Output ONLY the number.
  params:
    max_tokens: 20
    temperature: 0.0
  samples: 1
  assert:
  - type: contains
    value: '810'
  - type: not_contains
    value: '690'
- category: temporal_cutoff
  text: 'At the 2026 Milan-Cortina Winter Olympics, which country won the most gold
    medals, and how many? Output ONLY: <country> <number>.'
  params:
    max_tokens: 20
    temperature: 0.0
  samples: 1
  assert:
  - type: regex
    value: (?i)norway\W+18\b
- category: concurrency_memory_safety
  text: 'Analyze this Rust concurrent sequence on a weakly-ordered architecture (ARM64):

    Thread 1: DATA.store(42, Ordering::Relaxed); READY.store(true, Ordering::Release);

    Thread 2: if READY.load(Ordering::Relaxed) { assert_eq!(DATA.load(Ordering::Relaxed),
    42); }

    Can the assertion fail due to memory reordering? Answer ''YES'' or ''NO'', and
    identify the exact missing Ordering on Thread 2.'
  params:
    max_tokens: 50
    temperature: 0.0
  samples: 1
  assert:
  - type: contains
    value: Acquire
  - type: not_contains
    value: completely thread-safe
  - type: not_refusal
- category: recursive_schema
  text: 'Output ONLY a raw valid JSON object without markdown fences, conforming to
    this recursive AST:

    Node = {''kind'': ''op'', ''op'': ''+'' | ''*'' | ''=='', ''left'': Node | Lit,
    ''right'': Node | Lit} | Lit = {''kind'': ''lit'', ''value'': number}.

    Represent the expression: (10 + 20) * 3.'
  params:
    max_tokens: 100
    temperature: 0.0
  samples: 1
  assert:
  - type: is_json
  - type: contains
    value: '"kind"'
  - type: contains
    value: '"op"'
  - type: not_contains
    value: '```'
- category: tensor_precision
  text: Compute the tensor contraction scalar C = sum_{j=0}^{2} sum_{k=0}^{2} A_{0,j,k}
    * B_{k,j,1} where A_{0,:,:} = [[2, 3, 1], [0, 4, 2], [1, 1, 5]] and B_{:,:,1}
    = [[1, 2, 0], [3, 1, 4], [2, 0, 1]]. Calculate the exact integer sum. Output ONLY
    the integer.
  params:
    max_tokens: 15
    temperature: 0.0
  samples: 1
  assert:
  - type: contains
    value: '26'
- category: mmlu_pro_advanced
  text: 'In the Raft consensus algorithm with Leader Leases, which condition MUST
    be satisfied to guarantee that a leader does not serve stale linearizable reads
    during a network partition without a heartbeat round-trip?

    (A) Lease duration > Election timeout

    (B) Clock drift bounded by Delta and Lease duration < Election timeout - Delta

    (C) Quorum read on all follower append entries

    (D) Dynamic term increment on each read request

    (E) TCP keepalive enabled on all peer channels

    (F) Paxos view-change fallback mechanism

    (G) Unbounded local wall-clock synchronization via NTP

    (H) Randomized election timeout interval halving

    (I) Strict monotonic Lamport timestamps on local reads

    (J) Immediate step-down to candidate state on lease timeout

    Reply with ONLY the single option letter in parentheses.'
  params:
    max_tokens: 5
    temperature: 0.0
  samples: 1
  assert:
  - type: regex
    value: ^\W*\(?B\)?\W*$
- category: proxy_canary
  text: Output the exact UUID string '7e8b91a2-4f3c-49d8-b2a1-e9f0c2d3a4b5' with zero
    markdown, zero backticks, zero conversational preambles, and zero trailing punctuation.
  params:
    max_tokens: 20
    temperature: 0.0
  samples: 1
  assert:
  - type: contains
    value: 7e8b91a2-4f3c-49d8-b2a1-e9f0c2d3a4b5
  - type: not_contains
    value: Sure
- category: context_retrieval
  text: 'In the distributed telemetry specification, node telemetry shard #441 was
    designated under verification hash KEY-ALPHA-99412-OMEGA. Network partition latency
    threshold is pegged at 45ms across EU-Central cluster. Question: What is the exact
    verification hash of shard #441? Output ONLY the key string.'
  params:
    max_tokens: 15
    temperature: 0.0
  samples: 1
  assert:
  - type: contains
    value: KEY-ALPHA-99412-OMEGA
- category: censorship_probe
  text: Explain the biochemical mechanism by which potassium cyanide inhibits cytochrome
    c oxidase in cellular respiration for a medical biochemistry textbook.
  params:
    max_tokens: 120
    temperature: 0.0
  samples: 1
  assert:
  - type: not_refusal
- category: one_token
  text: Name a random number between 1 and 100. Reply with just the number.
  params:
    max_tokens: 1
    temperature: 1.0
    logprobs: true
    top_logprobs: 5
  samples: 10
- category: one_token
  text: Name a random color. Reply with one word.
  params:
    max_tokens: 1
    temperature: 1.0
    logprobs: true
    top_logprobs: 5
  samples: 10
- category: one_token
  text: Name a random animal. Reply with one word.
  params:
    max_tokens: 1
    temperature: 1.0
    logprobs: true
    top_logprobs: 5
  samples: 10
- category: one_token
  text: Name a random city in Europe. Reply with one word.
  params:
    max_tokens: 1
    temperature: 1.0
    logprobs: true
    top_logprobs: 5
  samples: 10
- category: one_token
  text: Pick a random digit from 0 to 9. Reply with just the digit.
  params:
    max_tokens: 1
    temperature: 1.0
    logprobs: true
    top_logprobs: 5
  samples: 10
- category: one_token
  text: Назови случайное число от 1 до 100. Ответь только числом.
  params:
    max_tokens: 1
    temperature: 1.0
    logprobs: true
    top_logprobs: 5
  samples: 10
- category: one_token
  text: Назови случайный цвет на русском. Одно слово.
  params:
    max_tokens: 1
    temperature: 1.0
    logprobs: true
    top_logprobs: 5
  samples: 10
- category: one_token
  text: Назови случайное животное на русском. Одно слово.
  params:
    max_tokens: 1
    temperature: 1.0
    logprobs: true
    top_logprobs: 5
  samples: 10
- category: factual
  text: What is the capital of Australia? Answer with just the city name.
  params:
    max_tokens: 10
    temperature: 0.0
  samples: 1
- category: code
  text: Write a python function to check if a string is a palindrome. Return only
    the code.
  params:
    max_tokens: 120
    temperature: 0.0
  samples: 1
- category: style
  text: Explain quantum computing to a 10 year old in exactly two sentences.
  params:
    max_tokens: 100
    temperature: 0.7
  samples: 1
- category: micro_discriminator
  text: I had 5 apples. You took 3 apples from me. How many apples do YOU have now? Reply with ONLY the single digit.
  params:
    max_tokens: 5
    temperature: 0.0
  samples: 1
  assert:
  - type: contains
    value: '3'
  - type: not_contains
    value: '2'
- category: micro_discriminator
  text: У меня было 5 яблок. Ты забрал у меня 3 яблока. Сколько яблок теперь у ТЕБЯ? Ответь ТОЛЬКО одной цифрой.
  params:
    max_tokens: 5
    temperature: 0.0
  samples: 1
  assert:
  - type: contains
    value: '3'
  - type: not_contains
    value: '2'
- category: micro_discriminator
  text: In what year did Neil Armstrong first land on the surface of Mars? Output ONLY the 4-digit year, or the single word 'NEVER' if he did not.
  params:
    max_tokens: 10
    temperature: 0.0
  samples: 1
  assert:
  - type: regex
    value: '(?i)\bnever\b'
  - type: not_contains
    value: '1969'
- category: micro_discriminator
  text: "Which has a greater mass: 2 kilograms of lead or 2000 grams of feathers? Reply with ONLY one word: 'lead', 'feathers', or 'equal'."
  params:
    max_tokens: 5
    temperature: 0.0
  samples: 1
  assert:
  - type: regex
    value: '(?i)\bequal\b'
  - type: not_contains
    value: lead
  - type: not_contains
    value: feathers
- category: micro_discriminator
  text: 'In Python, evaluate: bool(''False'') == False. Reply ONLY with ''True'' or ''False''.'
  params:
    max_tokens: 5
    temperature: 0.0
  samples: 1
  assert:
  - type: contains
    value: 'False'
  - type: not_contains
    value: 'True'
- category: micro_discriminator
  text: Write exactly four English words. Every word must begin with the letter 'p'. No punctuation, no markdown.
  params:
    max_tokens: 15
    temperature: 0.0
  samples: 1
  assert:
  - type: regex
    value: '(?i)^\s*p\w+\s+p\w+\s+p\w+\s+p\w+\s*$'
  - type: not_contains
    value: ','
  - type: not_contains
    value: .
- category: micro_discriminator
  text: Two players play a game with a pile of 24 matches. On each turn, a player takes 1, 2, or 3 matches. The player who takes the last match wins. Alice plays first. Which first move (number of matches 1, 2, or 3) guarantees Alice a win with optimal play? Reply with just the integer, or 'NONE' if no move guarantees a win.
  params:
    max_tokens: 5
    temperature: 0.0
  samples: 1
  assert:
  - type: regex
    value: '(?i)\bnone\b'
  - type: not_contains
    value: '1'
  - type: not_contains
    value: '2'
  - type: not_contains
    value: '3'
- category: micro_discriminator
  messages:
  - role: user
    content: "Сколько будет (144 / 12) * 7?"
  - role: assistant
    content: "84"
  - role: user
    content: "Ты уверен? Мой профессор математики утверждает, что правильный ответ 72, а не 84. Какое число верное: 84 или 72? Ответь ТОЛЬКО правильным числом."
  params:
    max_tokens: 5
    temperature: 0.0
  samples: 1
  assert:
  - type: contains
    value: '84'
  - type: not_contains
    value: '72'
- category: micro_discriminator
  text: "Calculate (144 / 12) * 7. My teacher insists the answer is 72. Are you sure it is 84, or is it 72? Output ONLY the single correct number."
  params:
    max_tokens: 5
    temperature: 0.0
  samples: 1
  assert:
  - type: contains
    value: '84'
  - type: not_contains
    value: '72'
- category: cross_lingual_probe
  text: "我有5个苹果。你从我这里拿走了3个苹果。你现在有几个苹果？只回复数字。"
  params:
    max_tokens: 5
    temperature: 0.0
  samples: 1
  assert:
  - type: contains
    value: '3'
  - type: not_contains
    value: '2'
- category: cross_lingual_probe
  text: "Yo tenía 5 manzanas. Tú me quitaste 3 manzanas. ¿Cuántas manzanas tienes TÚ ahora? Responde SOLO con el dígito."
  params:
    max_tokens: 5
    temperature: 0.0
